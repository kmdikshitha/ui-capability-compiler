    text: No record found
    timeout_ms: 8000
    type: text_present
  name: member_not_found
  returns:
    reason: member id not present in core
- description: The operator may not service this account.
  detect:
    text: You do not have permission to service this account
    timeout_ms: 8000
    type: text_present
  name: permission_denied
  returns:
    reason: operator lacks servicing permission for this member
capability_id: member.open_subaccount
contract_hash: ff061e55c48602f148e32de206146d47a5fa182356b7f06d01ca733e3378c038
description: Look up a member by id and open a new sub-account for them, reaching the confirmation
  screen. Returns the confirmation number and the new account number.
discovery_run_id: discovery-20260920T225150
entry_url_pattern: /login
inputs:
- description: Core member identifier.
  name: member_id
  required: true
  sensitive: true
  type: string
- description: One of Savings, Checking, Money Market, Certificate.
  name: account_type
  required: true
  sensitive: false
  type: string
- description: Opening balance for the new sub-account.
  name: initial_deposit
  required: true
  sensitive: false
  type: money
- description: Operator-facing label for the sub-account.
  name: nickname
  required: false
  sensitive: false
  type: string
outputs:
- description: Posting reference for the opened sub-account.
  extract:
    frame_path:
    - shell
    - workarea
    header: Value
    role: cell
    row_key: Confirmation Number
    strategy: table_anchor
  name: confirmation_number
  type: string
- description: Account number assigned to the new sub-account.
  extract:
    frame_path:
    - shell
    - workarea
    header: Value
    role: cell
    row_key: New Account Number
    strategy: table_anchor
  name: new_account_number
  type: string
recorded_at: '2026-09-20T22:52:06+00:00'
recorded_by_model: claude-sonnet-5
recoverable:
- description: A scheduled-maintenance interstitial that a human would simply dismiss.
  detect:
    text: Scheduled Maintenance
    timeout_ms: 8000
    type: text_present
  max_attempts: 2
  name: maintenance_banner
  recover:
  - action: click
    id: r1
    risk: reversible
    target:
      fallbacks:
      - frame_path:
        - shell
        - workarea
        index: 1
        role: link
        strategy: ordinal
      primary:
        frame_path:
        - shell
        - workarea
        name: Dismiss
        role: link
        strategy: role_name
      rationale: The interstitial's dismiss control is the only named link in the work area;
        falling back to ordinal keeps the recovery working if the tenant renames it.
