<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Technical architecture: an AI agent or CLI drives a discovery loop that calls the Claude API and an artifact compiler, or a replay executor that never imports the LLM. Both paths pass through one guardrails layer into a surface abstraction with a Playwright driver and a planned desktop driver, which drives the legacy target app. An operator console attaches to the same browser over CDP. A flat-file store holds artifacts, tenant overrides, the control custody chain and evidence.">
<style>
  text { font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,'Liberation Sans',Arial,sans-serif; fill:#141922; }
  .mono { font-family:'IBM Plex Mono','DejaVu Sans Mono',monospace; }
  .m { fill:#5D6875; }
  .arrow { stroke:#141922; stroke-width:2.4; fill:none; }
  .dash { stroke:#5D6875; stroke-width:2.4; fill:none; stroke-dasharray:9 6; }
  .band { fill:#F5F7FA; stroke:#C4CCD6; stroke-width:2; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141922"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5D6875"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

<rect x="380" y="124" width="920" height="316" rx="10" class="band"/>
<text x="404" y="160" font-size="20" font-weight="700" letter-spacing="1.4">CORE</text>
<text x="500" y="160" font-size="17" class="m" text-anchor="start">one process · flat files · no queues</text>
<rect x="420" y="24" width="360" height="78" rx="6" fill="#FAEFDC" stroke="#8F5400" stroke-width="2.6"/>
<text x="600" y="58" font-size="22" font-weight="700" class="" text-anchor="middle">Claude API</text>
<text x="600" y="81" font-size="16" font-style="italic" fill="#8F5400" class="" text-anchor="middle">discovery only — never imported by replay/</text>
<rect x="420" y="184" width="360" height="92" rx="6" fill="#FAEFDC" stroke="#8F5400" stroke-width="2.6"/>
<text x="600" y="214" font-size="22" font-weight="700" class="" text-anchor="middle">Discovery loop</text>
<text x="600" y="238" font-size="17" class="" text-anchor="middle">observe → decide → act</text>
<text x="600" y="260" font-size="15" class="mono m" text-anchor="middle">agent/</text>
<rect x="900" y="184" width="360" height="92" rx="6" fill="#FAEFDC" stroke="#8F5400" stroke-width="2.6"/>
<text x="1080" y="214" font-size="22" font-weight="700" class="" text-anchor="middle">Artifact compiler</text>
<text x="1080" y="238" font-size="17" class="" text-anchor="middle">transcript → typed capability</text>
<text x="1080" y="260" font-size="15" class="mono m" text-anchor="middle">artifact/</text>
<rect x="420" y="334" width="360" height="92" rx="6" fill="#F8E1E5" stroke="#94293B" stroke-width="2.6"/>
<text x="600" y="364" font-size="22" font-weight="700" class="" text-anchor="middle">Escalation</text>
<text x="600" y="388" font-size="17" class="" text-anchor="middle">controller: agent | human</text>
<text x="600" y="410" font-size="15" class="mono m" text-anchor="middle">escalation/</text>
<rect x="900" y="334" width="360" height="92" rx="6" fill="#D9EFEC" stroke="#0A645D" stroke-width="2.6"/>
<text x="1080" y="364" font-size="22" font-weight="700" class="" text-anchor="middle">Replay executor</text>
<text x="1080" y="388" font-size="17" class="" text-anchor="middle">deterministic · no model</text>
<text x="1080" y="410" font-size="15" class="mono m" text-anchor="middle">replay/</text>
<path d="M 600 182 L 600 106" class="arrow" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="614" y="148" font-size="16" class="m" text-anchor="start">tool use</text>
<path d="M 782 229 L 898 229" class="arrow" marker-end="url(#a)"/>
<text x="840" y="218" font-size="15" class="m" text-anchor="middle">successful run</text>
<path d="M 898 379 L 782 379" class="arrow" marker-end="url(#a)"/>
<text x="840" y="368" font-size="15" class="m" text-anchor="middle">stuck</text>
<rect x="40" y="184" width="280" height="92" rx="6" fill="#EEF1F5" stroke="#5D6875" stroke-width="2.6"/>
<text x="180" y="225" font-size="22" font-weight="700" class="" text-anchor="middle">AI agent / CLI</text>
<text x="180" y="249" font-size="17" class="m" text-anchor="middle">discover · replay</text>
<rect x="40" y="334" width="280" height="92" rx="6" fill="#F8E1E5" stroke="#94293B" stroke-width="2.6"/>
<text x="180" y="374" font-size="21" font-weight="700" class="" text-anchor="middle">Operator console</text>
<text x="180" y="399" font-size="17" class="m" text-anchor="middle">FastAPI + HTML</text>
<path d="M 322 229 L 416 229" class="arrow" marker-end="url(#a)"/>
<path d="M 322 379 L 416 379" class="arrow" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M 180 278 L 180 304 L 1080 304 L 1080 330" class="arrow" marker-end="url(#a)"/>
<text x="640" y="296" font-size="15" class="m" text-anchor="middle">replay path</text>
<rect x="380" y="470" width="920" height="84" rx="8" fill="#F8E1E5" stroke="#94293B" stroke-width="2.6"/>
<text x="840" y="506" font-size="21" font-weight="700" class="" text-anchor="middle">GUARDRAILS</text>
<text x="840" y="531" font-size="17" class="" text-anchor="middle">allowlist · risk class · redaction — one function, called before every action on both paths</text>
<path d="M 470 428 L 470 466" class="arrow" marker-end="url(#a)"/>
<path d="M 1080 428 L 1080 466" class="arrow" marker-end="url(#a)"/>
<rect x="380" y="590" width="920" height="210" rx="10" class="band"/>
<text x="404" y="626" font-size="20" font-weight="700" letter-spacing="1.4">SURFACE ABSTRACTION</text>
<rect x="400" y="660" width="220" height="92" rx="6" fill="#FFFFFF" stroke="#C4CCD6" stroke-width="2.6"/>
<text x="510" y="701" font-size="20" font-weight="700" class="" text-anchor="middle">Surface protocol</text>
<text x="510" y="724" font-size="16" class="mono m" text-anchor="middle">observe() · act()</text>
<rect x="720" y="660" width="280" height="92" rx="6" fill="#D9EFEC" stroke="#0A645D" stroke-width="2.6"/>
<text x="860" y="700" font-size="21" font-weight="700" class="" text-anchor="middle">Playwright driver</text>
<text x="860" y="725" font-size="17" class="m" text-anchor="middle">accessibility tree + CDP</text>
<rect x="1060" y="660" width="220" height="92" rx="6" fill="#FFFFFF" stroke="#5D6875" stroke-width="2.6" stroke-dasharray="9 6"/>
<text x="1170" y="700" font-size="20" font-weight="700" class="" text-anchor="middle">Desktop driver</text>
<text x="1170" y="724" font-size="17" font-style="italic" class="m" text-anchor="middle">designed, not built</text>
<path d="M 470 552 L 470 656" class="arrow" marker-end="url(#a)"/>
<path d="M 622 706 L 716 706" class="arrow" marker-end="url(#a)"/>
<path d="M 580 658 L 580 636 L 1170 636 L 1170 656" class="dash" marker-end="url(#am)"/>
<rect x="380" y="850" width="920" height="90" rx="6" fill="#EEF1F5" stroke="#5D6875" stroke-width="2.6"/>
<text x="840" y="890" font-size="22" font-weight="700" class="" text-anchor="middle">Target application — legacy credit-union teller console</text>
<text x="840" y="914" font-size="17" class="m" text-anchor="middle">no API of any kind  ·  iframe  ·  nested tables  ·  ids that regenerate per request  ·  no test ids</text>
<path d="M 960 754 L 960 846" class="arrow" marker-end="url(#a)"/>
<text x="974" y="806" font-size="15" class="m" text-anchor="start">drives</text>
<path d="M 180 428 L 180 818 L 760 818 L 760 756" class="dash" marker-end="url(#am)"/>
<text x="400" y="808" font-size="16" class="m" text-anchor="start">CDP attach — the same browser, not a new one</text>
<rect x="1380" y="124" width="500" height="516" rx="10" class="band"/>
<text x="1404" y="160" font-size="20" font-weight="700" letter-spacing="1.4">FLAT-FILE STORE</text>
<rect x="1420" y="184" width="420" height="84" rx="6" fill="#F8F5EC" stroke="#7A6A45" stroke-width="2.6"/>
<text x="1630" y="221" font-size="19" font-weight="700" class="mono" text-anchor="middle">artifacts/*.json</text>
<text x="1630" y="243" font-size="15" class="m" text-anchor="middle">versioned · immutable · content-hashed</text>
<rect x="1420" y="300" width="420" height="84" rx="6" fill="#F8F5EC" stroke="#7A6A45" stroke-width="2.6"/>
<text x="1630" y="337" font-size="19" font-weight="700" class="mono" text-anchor="middle">tenant-overrides/</text>
<text x="1630" y="359" font-size="15" class="m" text-anchor="middle">patch mechanics only — contract hash guarded</text>
<rect x="1420" y="416" width="420" height="84" rx="6" fill="#F8F5EC" stroke="#7A6A45" stroke-width="2.6"/>
<text x="1630" y="453" font-size="19" font-weight="700" class="mono" text-anchor="middle">control.jsonl</text>
<text x="1630" y="475" font-size="15" class="m" text-anchor="middle">custody chain — and the IPC channel itself</text>
<rect x="1420" y="532" width="420" height="84" rx="6" fill="#F8F5EC" stroke="#7A6A45" stroke-width="2.6"/>
<text x="1630" y="569" font-size="19" font-weight="700" class="mono" text-anchor="middle">evidence/runs/</text>
<text x="1630" y="591" font-size="15" class="m" text-anchor="middle">steps · screenshots · Playwright trace</text>
<path d="M 1262 214 L 1330 214 L 1330 226 L 1416 226" class="arrow" marker-end="url(#a)"/>
<text x="1296" y="200" font-size="15" class="m" text-anchor="middle">new version</text>
<path d="M 1416 250 L 1350 250 L 1350 364 L 1264 364" class="arrow" marker-end="url(#a)"/>
<text x="1358" y="282" font-size="15" class="m" text-anchor="start">loads</text>
<path d="M 1416 356 L 1390 356 L 1390 404 L 1264 404" class="arrow" marker-end="url(#a)"/>
<text x="1404" y="716" font-size="16" font-weight="700" class="m" letter-spacing="1.2">LEGEND</text>
<rect x="1404" y="744" width="26" height="26" rx="4" fill="#FAEFDC" stroke="#8F5400" stroke-width="2.4"/>
<text x="1444" y="763" font-size="17" class="m">discovery path — model in the loop</text>
<rect x="1404" y="784" width="26" height="26" rx="4" fill="#D9EFEC" stroke="#0A645D" stroke-width="2.4"/>
<text x="1444" y="803" font-size="17" class="m">replay path — no model at all</text>
<rect x="1404" y="824" width="26" height="26" rx="4" fill="#F8E1E5" stroke="#94293B" stroke-width="2.4"/>
<text x="1444" y="843" font-size="17" class="m">safety, control transfer</text>
<rect x="1404" y="864" width="26" height="26" rx="4" fill="#FFFFFF" stroke="#5D6875" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="1444" y="883" font-size="17" class="m">designed, not built</text>
</svg>