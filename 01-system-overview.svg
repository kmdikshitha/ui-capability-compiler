<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-label="Discovery and replay run through the same guardrails, surface abstraction and target application. Discovery has Claude deciding each step; replay has a deterministic executor walking saved steps. The capability artifact is written by discovery and loaded by every later replay.">
  <style>
    .bg   { fill:#FFFFFF; }
    .box  { fill:#FFFFFF; stroke:#C4CCD6; stroke-width:1.75; }
    .band { fill:#EDF1F5; stroke:#C4CCD6; stroke-width:1.75; }
    .amber{ fill:#FAEFDC; stroke:#8F5400; stroke-width:2.25; }
    .teal { fill:#D9EFEC; stroke:#0A645D; stroke-width:2.25; }
    .art  { fill:#FFF7E4; stroke:#141922; stroke-width:2.5; }
    text  { font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; fill:#141922; }
    .m    { fill:#5D6875; }
    .amberT { fill:#8F5400; }
    .tealT  { fill:#0A645D; }
    .mono { font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; }
    .arrow{ stroke:#141922; stroke-width:2; fill:none; }
    .dash { stroke:#5D6875; stroke-width:2; fill:none; stroke-dasharray:7 5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141922"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D6875"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="720"/>

  <!-- column headers -->
  <text x="250" y="34" class="amberT" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">DISCOVERY</text>
  <text x="250" y="58" class="m" font-size="13" text-anchor="middle">runs once · ~40 s · costs tokens</text>
  <text x="830" y="34" class="tealT" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">REPLAY</text>
  <text x="830" y="58" class="m" font-size="13" text-anchor="middle">every call after · ~1 s · no model cost</text>

  <!-- inputs -->
  <rect class="box" x="70" y="78" width="360" height="66" rx="4"/>
  <text x="250" y="106" font-size="15" font-weight="600" text-anchor="middle">Goal in natural language</text>
  <text x="250" y="128" class="m mono" font-size="12" text-anchor="middle">"open a sub-account for member 12345"</text>

  <rect class="box" x="650" y="78" width="360" height="66" rx="4"/>
  <text x="830" y="106" font-size="15" font-weight="600" text-anchor="middle">Typed inputs from the caller</text>
  <text x="830" y="128" class="m mono" font-size="12" text-anchor="middle">member_id = 54321</text>

  <line x1="250" y1="144" x2="250" y2="168" class="arrow" marker-end="url(#ah)"/>
  <line x1="830" y1="144" x2="830" y2="168" class="arrow" marker-end="url(#ah)"/>

  <!-- the only difference -->
  <rect class="amber" x="70" y="172" width="360" height="88" rx="4"/>
  <text x="250" y="203" font-size="18" font-weight="700" text-anchor="middle">Claude</text>
  <text x="250" y="227" font-size="13.5" text-anchor="middle">decides the next action each turn</text>
  <text x="250" y="249" class="amberT" font-size="12.5" font-style="italic" text-anchor="middle">LLM in the loop</text>

  <rect class="teal" x="650" y="172" width="360" height="88" rx="4"/>
  <text x="830" y="203" font-size="18" font-weight="700" text-anchor="middle">Replay executor</text>
  <text x="830" y="227" font-size="13.5" text-anchor="middle">walks the saved steps in order</text>
  <text x="830" y="249" class="tealT" font-size="12.5" font-style="italic" text-anchor="middle">no model at all</text>

  <line x1="250" y1="260" x2="250" y2="284" class="arrow" marker-end="url(#ah)"/>
  <line x1="830" y1="260" x2="830" y2="284" class="arrow" marker-end="url(#ah)"/>

  <!-- shared: guardrails -->
  <rect class="band" x="70" y="288" width="940" height="74" rx="4"/>
  <text x="540" y="319" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.8">GUARDRAILS</text>
  <text x="540" y="344" class="m" font-size="13" text-anchor="middle">allowlist · risk class · redaction — checked before every action, on both paths</text>

  <line x1="250" y1="362" x2="250" y2="386" class="arrow" marker-end="url(#ah)"/>
  <line x1="830" y1="362" x2="830" y2="386" class="arrow" marker-end="url(#ah)"/>

  <!-- shared: surface -->
  <rect class="band" x="70" y="390" width="940" height="90" rx="4"/>
  <text x="540" y="420" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.8">SURFACE ABSTRACTION</text>
  <text x="540" y="447" class="mono" font-size="13" text-anchor="middle">observe() → accessibility tree          act() → click · type · navigate</text>
  <text x="540" y="469" class="m" font-size="11.5" font-style="italic" text-anchor="middle">the only layer that knows about Playwright — a desktop driver implements the same two methods</text>

  <line x1="250" y1="480" x2="250" y2="504" class="arrow" marker-end="url(#ah)"/>
  <line x1="830" y1="480" x2="830" y2="504" class="arrow" marker-end="url(#ah)"/>

  <!-- shared: app -->
  <rect class="band" x="70" y="508" width="940" height="84" rx="4"/>
  <text x="540" y="538" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.8">TARGET APPLICATION</text>
  <text x="540" y="563" font-size="13" text-anchor="middle">legacy credit-union teller console — no API of any kind</text>
  <text x="540" y="584" class="m" font-size="11.5" text-anchor="middle">iframe · nested tables · ids that regenerate per request · no test ids</text>

  <!-- artifact flow -->
  <path d="M 70 550 L 34 550 L 34 668 L 360 668" class="dash" marker-end="url(#ahm)"/>
  <path d="M 720 668 L 1046 668 L 1046 111 L 1014 111" class="dash" marker-end="url(#ahm)"/>
  <text x="205" y="658" class="m" font-size="12" text-anchor="middle">successful run compiles to</text>
  <text x="885" y="658" class="m" font-size="12" text-anchor="middle">loaded by every later call</text>

  <rect class="art" x="370" y="630" width="340" height="76" rx="4"/>
  <text x="540" y="661" font-size="15" font-weight="700" text-anchor="middle">capability artifact — immutable, versioned</text>
  <text x="540" y="685" class="m" font-size="12" text-anchor="middle">typed I/O · ranked locators · checkpoints · outcomes</text>
</svg>
