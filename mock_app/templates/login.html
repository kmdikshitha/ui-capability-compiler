<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>Sign On &mdash; {{ tenant.brand_short }}</title></head>
<body bgcolor="#d4d0c8">
<table width="100%" border="0" cellpadding="4" cellspacing="0" bgcolor="#000080">
  <tr><td><font face="Tahoma" size="2" color="#ffffff"><b>{{ tenant.brand }}</b></font></td></tr>
</table>
<br>
<form action="/login" method="post">
<table border="0" cellpadding="6" cellspacing="0">
  <tr><td colspan="2"><font face="Tahoma" size="3"><b>{{ tenant.app_title }} Sign On</b></font></td></tr>
  {% if error %}
  <tr><td colspan="2"><font face="Tahoma" size="2" color="#aa0000"><b>{{ error }}</b></font></td></tr>
  {% endif %}
  <tr>
    <td><font face="Tahoma" size="2">Operator ID</font></td>
    <td><input type="text" name="operator" value="OP-4471" size="18"
               id="ctl00_{{ rid() }}_txtOperator" aria-label="Operator ID"></td>
  </tr>
  <tr>
    <td><font face="Tahoma" size="2">Password</font></td>
    <td><input type="password" name="password" value="" size="18"
               id="ctl00_{{ rid() }}_txtPassword" aria-label="Password"></td>
  </tr>
  <tr>
    <td>&nbsp;</td>
    <td><input type="submit" value="{{ tenant.labels.signin_button }}" id="ctl00_{{ rid() }}_btnSignOn"></td>
  </tr>
</table>
</form>
<br>
<font face="Tahoma" size="1">Any operator ID and password are accepted in this sandbox.</font>
</body>
</html>
