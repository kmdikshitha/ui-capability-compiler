[project]
name = "ui-capability-compiler"
version = "0.1.0"
description = "Discover a legacy UI flow with an LLM once, compile it into a typed versioned capability, replay it deterministically with no model in the loop."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "mock_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
